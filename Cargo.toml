[package]
name = "matrix-hub"
version = "0.1.0"
authors = ["Keenan Thompson <github@keenant.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "matrix-hub"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"
# Debug info isn't flashed; it gives coredump backtraces file:line info
debug = true

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"


[dependencies]
matrix-hub-core = { path = "core" }
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section"] }
embedded-graphics = "0.8.1"
embedded-svc = "0.29"
anyhow = "1.0"
dotenvy_macro = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
buffa = { version = "0.7", default-features = false }
lis3dh = "0.4.4"

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
extra_components = [{ component_dirs = ["components/hub75_wrapper"], bindings_header = "components/hub75_wrapper/bindings.h", bindings_module = "hub75" }]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
unwrap_used = "warn"
expect_used = "warn"


