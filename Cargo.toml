[package]
name = "matrix-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "matrix-hub"
path = "./src/bin/main.rs"

[dependencies]
allocator-api2 = { version = "0.3", default-features = false, features = [
  "alloc",
] }
anyhow = { version = "1.0", default-features = false }
async-trait = "0.1"
atomic_float = "1.1"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
critical-section = "1.2"
embassy-executor = "0.9"
embassy-futures = "0.1"
embassy-net = { version = "0.7", default-features = false, features = [
  "dhcpv4",
  "dns",
  "proto-ipv4",
  "tcp",
  "udp",
] }
embassy-sync = "0.7"
embassy-time = "0.5"
embedded-graphics = "0.8"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-nal-async = "0.9"
xtensa-lx = "0.9.0"
esp-alloc = "0.9"
esp-backtrace = { version = "0.18", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-storage = { version = "0.8", features = ["esp32s3"] }
embedded-storage = "0.3"
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }
esp-hal = { version = "1.0", features = ["esp32s3", "psram", "unstable"] }
esp-hub75 = { version = "0.8", features = ["esp32s3", "iram"] }
lis3dh-async = "0.9"
esp-println = { version = "0.16", default-features = false, features = [
  "critical-section",
  "esp32s3",
  "log-04",
  "uart",
] }
esp-radio = { version = "0.17", features = [
  "esp-alloc",
  "esp32s3",
  "smoltcp",
  "unstable",
  "wifi",
] }
esp-rtos = { version = "0.2", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
] }
heapless = "0.9"
libm = "0.2"
log = "0.4"
micromath = "2.1"
prost = { version = "0.14.3", default-features = false, features = ["derive"] }
portable-atomic = { version = "1.10", features = ["critical-section"] }
reqwless = { version = "0.13", default-features = false, features = [
  "embedded-tls",
] }
smoltcp = { version = "0.12", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }
static_cell = "2.1"

[build-dependencies]
prost-build = "0.14.3"
protoc-prebuilt = "0.3"

[lints.rust]
dead_code = "warn"
unsafe_code = "warn"
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
enum_glob_use = "warn"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unused_async = "warn"
unwrap_used = "warn"

[profile.dev]
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = false            # Disable debug info for smaller binary
debug-assertions = false
incremental = false
lto = 'fat'              # Link-time optimization
opt-level = 'z'          # Optimize for size
overflow-checks = false
strip = true             # Strip symbols from binary
panic = 'abort'          # Reduce panic overhead
