syntax = "proto3";

// Represents WiFi connection credentials
message WifiCredentials {
    // The SSID of the WiFi network to connect to
    string ssid = 1;
    // The password of the WiFi network to connect to
    string pass = 2;
}

// Stores all persistent device configuration loaded at startup
message DeviceConfig {
    // Optional WiFi credentials. If absent, fallback to defaults.
    WifiCredentials wifi = 1;
    // Global LED brightness level (0-255)
    uint32 brightness = 2;
}

// Request to update the device configuration following AIP-134
message UpdateConfigRequest {
    // The configuration to update.
    DeviceConfig config = 1;
    // The list of fields to update.
    repeated string update_mask = 2;
}
