syntax = "proto3";

package app_state;

message MatrixHubState {
    // Shared system state
    SystemInfo system_info = 1;
    
    // Per-app state
    PlasmaAppState plasma = 2;
    MtaAppState mta = 3;
    ClockAppState clock = 4;
    SandboxAppState sandbox = 6;
    
    // Configuration
    Config config = 5;
}

message SystemInfo {
    bool wifi_connected = 1;
    string wifi_ssid = 2;
    string ip_address = 3;
    float seconds_alive = 4;
    uint32 fps = 6;
    uint32 tps = 7;
    AppId current_app_id = 8;
    Accelerometer accelerometer = 9;
}

message Accelerometer {
    // Normalized accelerometer readings (-1.0 to 1.0)
    float accel_x = 1;
    float accel_y = 2;
    float accel_z = 3;
}

message PlasmaAppState {
    float phase = 1;
}

message MtaAppState {
    repeated StationStatus stations = 1;
    uint64 last_updated_secs = 2;
    uint64 scroll_start_secs = 3;
    uint32 current_station_index = 4;
}

message StationStatus {
    string station_id = 1;
    repeated Platform platforms = 2;
}

message Platform {
    string direction = 1;
    repeated Train trains = 2;
}

message Train {
    string route = 1;
    uint64 arrives_at_secs = 2;
    uint64 arrives_in_secs = 3;
}

message ClockAppState {
    string timezone = 1;
}

message SandboxAppState {
    // Particle system state
    repeated Particle particles = 1;
    // uint32 spawn_counter = 2;
}

message Particle {
    bool active = 1;
    float x = 2;
    float y = 3;
    float vx = 4;
    float vy = 5;
    uint32 lifetime = 6;
    uint32 color_r = 7;
    uint32 color_g = 8;
    uint32 color_b = 9;
}

message Config {
    WifiConfig wifi = 1;
    MtaConfig mta = 2;
    AppRotationConfig app_rotation = 3;
}

message WifiConfig {
    string ssid = 1;
    string password = 2;
}

message MtaConfig {
    repeated StationConfig stations = 1;
}

message StationConfig {
    string route = 1; // e.g., "L", "G"
    string station_id = 2; // e.g., "L10", "G29"
}

message AppId {
    message Mta {}
    message Plasma {}
    message Sandbox {}
    oneof id {
        Mta mta = 1;
        Plasma plasma = 2;
        Sandbox sandbox = 3;
    }
}

message AppRotationConfig {
    repeated AppId enabled_apps = 1;
}
