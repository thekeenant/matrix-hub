<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="mb-8">
      <h1 class="text-4xl font-bold mb-2 text-blue-400">Matrix Hub</h1>
      <p class="text-gray-400 text-lg">ESP32-S3 LED Matrix Controller</p>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <a href="/config"
        class="block p-6 bg-gray-800 hover:bg-gray-750 rounded-lg border border-gray-700 hover:border-blue-500 transition-all group">
        <h2 class="text-xl font-semibold mb-2 text-blue-400 group-hover:text-blue-300">⚙️ Configuration</h2>
        <p class="text-gray-400">Edit and update the hub configuration in real-time with JSON validation</p>
      </a>

      <a href="/state"
        class="block p-6 bg-gray-800 hover:bg-gray-750 rounded-lg border border-gray-700 hover:border-blue-500 transition-all group">
        <h2 class="text-xl font-semibold mb-2 text-blue-400 group-hover:text-blue-300">📊 State</h2>
        <p class="text-gray-400">View the current state of the hub as JSON</p>
      </a>
    </div>

    <div class="mt-8 p-4 bg-gray-800 rounded-lg border border-gray-700">
      <h3 class="text-sm font-semibold text-gray-400 mb-2">System Info</h3>
      <div class="text-sm text-gray-500 space-y-1">
        <p>Device: ESP32-S3</p>
        <p>Firmware: Matrix Hub</p>
        <p>API Version: 1.0</p>
      </div>
    </div>
  </div>
</body>

</html>
